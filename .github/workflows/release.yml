name: Release skills
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir dist
          for f in */SKILL.md; do
            d=$(dirname "$f")
            zip -r "dist/$d.zip" "$d" -x "*.DS_Store"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true